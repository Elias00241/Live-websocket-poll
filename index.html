<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live WebSocket Poll</title>

    <link rel="stylesheet" href="style.css">

<!--          -->

</head>
<body>

    <h2>What is your favorite backend language?</h2>
    <div id="status">Connecting to server...</div>

    <!-- Poll Options -->
    <div class="poll-option">
        <button onclick="castVote('Python')">Python</button>
        <div class="bar-container">
            <div id="bar-Python" class="bar"></div>
            <span id="count-Python" class="counter">0</span>
        </div>
    </div>

    <div class="poll-option">
        <button onclick="castVote('JavaScript')">JavaScript</button>
        <div class="bar-container">
            <div id="bar-JavaScript" class="bar"></div>
            <span id="count-JavaScript" class="counter">0</span>
        </div>
    </div>

    <div class="poll-option">
        <button onclick="castVote('Go')">Go</button>
        <div class="bar-container">
            <div id="bar-Go" class="bar"></div>
            <span id="count-Go" class="counter">0</span>
        </div>
    </div>

<!--        -->

<script src="index.js" defer></script>

</body>
</html>
